<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratch Cat's Island Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f3ff;--panel:#fff;--ink:#2b2b4a;--purple:#855cd6;--motion:#4c97ff;--looks:#9966ff;--sound:#cf63cf;--events:#ffbf00;--control:#ffab19;--vars:#ff8c1a;--cs:calc(min(92vw,420px)/6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:500 18px/1.4 Fredoka,system-ui,sans-serif;padding:0 12px env(safe-area-inset-bottom,0)}
header{background:var(--purple);color:#fff;margin:0 -12px;padding:calc(10px + env(safe-area-inset-top,0)) 14px 12px}
.wrap{max-width:980px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
h1{font-size:1.5rem;margin:0}
.pill{background:#fff3;color:#fff;border:0;border-radius:99px;padding:4px 14px;font:inherit;font-size:.95rem;cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
nav button{width:44px;height:44px;border-radius:50%;border:3px solid #fff7;background:#0003;color:#fff;font:700 1.1rem Fredoka;cursor:pointer}
nav button.done{background:#3cb371}nav button.cur{border-color:#ffd84a;box-shadow:0 0 0 3px #ffd84a88}
#brief{background:var(--panel);border-radius:18px;padding:12px 16px;margin:14px 0;border:3px solid #d9ccff}
#brief h2{margin:0 0 2px;font-size:1.3rem;color:var(--purple)}#brief p{margin:0}
details{margin-top:6px;font-size:.9rem;color:#6a6a95}summary{cursor:pointer}
.main{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
@media(max-width:820px){.main{grid-template-columns:1fr}}
#stagebox{display:flex;flex-direction:column;align-items:center;gap:8px}
#stage{position:relative;width:calc(var(--cs)*6);height:calc(var(--cs)*6);border-radius:20px;overflow:hidden;border:5px solid #fff;box-shadow:0 4px 14px #0002;
background:linear-gradient(#0000 calc(100% - 2px),#ffffff99 0) 0 0/100% var(--cs),linear-gradient(90deg,#0000 calc(100% - 2px),#ffffff99 0) 0 0/var(--cs) 100%,#9fe0f5}
.sp{position:absolute;width:var(--cs);height:var(--cs);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.62);transition:left .3s,top .3s}
#cat{z-index:3}.arr{position:absolute;inset:0;display:flex;justify-content:center;color:#e0457b;font-style:normal;font-size:calc(var(--cs)*.26);line-height:1;transition:transform .3s}
.bubble{position:absolute;bottom:90%;left:50%;transform:translateX(-30%);background:#fff;color:#222;border:2px solid #999;border-radius:16px;padding:2px 10px;font-size:calc(var(--cs)*.27);white-space:nowrap;z-index:9}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .4s}@keyframes pp{50%{transform:scale(1.6)}}
@media(prefers-reduced-motion:reduce){.shake,.pop{animation:none}.sp,.arr{transition:none}}
#hud{display:flex;gap:16px;font-size:1rem}
#msg{min-height:3em;text-align:center;max-width:calc(var(--cs)*6);font-weight:700}#msg.bad{color:#c2410c}#msg.good{color:#15803d}
.panel{background:var(--panel);border-radius:18px;padding:12px;border:3px solid #d9ccff}
.lab{font-size:.95rem;color:#6a6a95;margin:2px 0 6px}
#script{min-height:170px;max-height:50vh;overflow:auto;background:#f4efff;border-radius:14px;padding:10px;margin-bottom:12px}
.hat{display:inline-block;background:var(--events);color:#4a3500;font-weight:700;border-radius:20px 20px 6px 6px;padding:6px 14px;margin-bottom:4px}
.blk{margin:3px 0;border-radius:8px;color:#fff;border:1px solid #0003}
.blk.motion{background:var(--motion)}.blk.looks{background:var(--looks)}.blk.sound{background:var(--sound)}.blk.control{background:var(--control);color:#3a2400}.blk.vars{background:var(--vars);color:#3a1c00}
.blk.on{outline:4px solid #333;box-shadow:0 0 12px #0006}
.row{display:flex;align-items:center;gap:6px;padding:8px 12px;font-weight:700;min-height:46px;flex-wrap:wrap;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.row button{border:0;border-radius:99px;background:#fff;color:#333;font:700 1rem Fredoka;padding:2px 12px;min-height:30px;cursor:pointer}
.row .x{margin-left:auto;width:30px;padding:0;background:#0004;color:#fff}
.zone{margin:0 8px 8px 24px;padding:4px 6px;border-left:8px solid #0003;background:#0002;border-radius:0 8px 8px 0;min-height:36px;cursor:pointer}.zone.tgt{background:#fff6;border-left-color:#fff}.zone.over{background:#fff8}
.zone:empty::before{content:'drop blocks here';font-size:.85rem;opacity:.7;font-weight:500}
.ph{height:14px;margin:3px 0;border-radius:7px;background:#2b2b4a}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pal button{border:0;border-radius:12px;padding:10px 14px;min-height:52px;font:700 1rem Fredoka;cursor:grab;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.pal .motion{background:var(--motion)}.pal .looks{background:var(--looks)}.pal .sound{background:var(--sound)}.pal .control{background:var(--control);color:#3a2400}.pal .vars{background:var(--vars);color:#3a1c00}
.pal button:disabled{opacity:.35;cursor:not-allowed}#pal.trash{outline:4px dashed #e0457b;outline-offset:5px;border-radius:12px}
.ctl{display:flex;gap:8px}.ctl button{flex:1;border:0;border-radius:99px;padding:14px;font:700 1.15rem Fredoka;cursor:pointer;color:#fff}
#run{background:#3cb371}#run.stop{background:#e0457b}#reset{background:#f59e0b}#clear{background:#8b8baf}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.ghost{position:fixed;z-index:50;pointer-events:none;padding:8px 14px;font-weight:700;opacity:.93;box-shadow:0 10px 24px #0007;transform:rotate(-2deg);border-radius:8px}
button:focus-visible{outline:4px solid #333;outline-offset:2px}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}#ov.show{display:flex}
#card{background:#fff;color:var(--ink);border-radius:26px;padding:24px;max-width:460px;width:100%;text-align:center}
#card h2{margin:0 0 6px;font-size:1.8rem}.big{font-size:3rem}
#card button,#card input{font:700 1.1rem Fredoka;border-radius:99px;padding:10px 22px;border:3px solid var(--purple);margin:6px 4px}#card button{background:var(--purple);color:#fff;cursor:pointer}
.cert{border:6px double var(--control);border-radius:16px;padding:14px;margin:10px 0}
@media print{body{background:#fff}header,.main,#brief{display:none}#ov{position:static;background:none;display:block}#card button,#card input{display:none}}
</style>
</head>

<header><div class="wrap">
<div class="top"><h1>🐱 Scratch Cat's Island</h1><span class="pill" id="clock">⏱ 00:00</span><span><button class="pill" id="spd">🐢 Slow</button> <button class="pill" id="mute">🔊 Sound on</button></span></div>

function blocked(x,y){return x<0||y<0||x>5||y>5||LV[cur].rocks.some(function(r){return r[0]===x&&r[1]===y})}
function fishAt(){var L=LV[cur];for(var i=0;i<L.fish.length;i++)if(!S.got[i]&&L.fish[i][0]===S.x&&L.fish[i][1]===S.y)return i;return -1}
function atGoal(){var g=LV[cur].goal;return!!g&&S.x===g[0]&&S.y===g[1]}
function test(c){if(c==='wall')return blocked(S.x+DX[S.d],S.y+DY[S.d]);if(c==='fish')return fishAt()>-1;return atGoal()}
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
function place(){var b=$('#cat');b.style.left='calc(var(--cs)*'+S.x+')';b.style.top='calc(var(--cs)*'+S.y+')';b.querySelector('.arr').style.transform='rotate('+S.ang+'deg)'}
function fail(m){throw{fail:m}}
async function ex(l){for(var i=0;i<l.length;i++)await one(l[i])}
async function one(n){if(!running)throw{stop:1};if(++S.steps>500)fail('The code never stopped! Try adding 🛑 stop all inside an if block.');hl(n.id);var t=n.t,b=B[t];
if(b.dx!==undefined||t==='fwd'){var dx=b.dx!==undefined?b.dx:DX[S.d],dy=b.dx!==undefined?b.dy:DY[S.d],nx=S.x+dx,ny=S.y+dy;
if(blocked(nx,ny)){$('#cat').classList.add('shake');beep(150,.25);await sleep(400);fail('Oops! The cat bumped into a tree or the edge. Check your blocks!')}
S.x=nx;S.y=ny;place();beep(420,.07);await sleep(D)}
else if(t==='turnL'||t==='turnR'){S.d=(S.d+(t==='turnL'?3:1))%4;S.ang+=t==='turnL'?-90:90;place();beep(330,.06);await sleep(D*.8)}
else if(t==='say'){S.say=1;if(atGoal())S.atSay=1;var k=$('#cat'),bb=document.createElement('div');bb.className='bubble';bb.textContent='Hello!';k.appendChild(bb);beep(700,.12);await sleep(D*1.5);bb.remove()}
else if(t==='sound'){S.snd=1;if(atGoal())S.atSnd=1;$('#cat').classList.add('pop');beep(300,.25);await sleep(D*.8);$('#cat').classList.remove('pop')}
else if(t==='wait')await sleep(D*1.2);
else if(t==='eat'){var i=fishAt();if(i<0)fail('No fish here! Use an if block and ask: touching fish?');S.got[i]=1;var f=$('#f'+i);f.classList.add('pop');setTimeout(function(){f.style.visibility='hidden'},300);beep(900,.15);hud();await sleep(D*.7)}
else if(t==='add'){S.n++;hud();beep(700,.1);await sleep(D*.6)}
else if(t==='stop')throw{halt:1};
else if(t==='rep'){for(var j=0;j<n.n;j++){await ex(n.body);hl(n.id)}}
else if(t==='forever'){for(;;){await ex(n.body);hl(n.id);if(++S.steps>500)fail('The code never stopped! Try adding 🛑 stop all inside an if block.');await sleep(60)}}
else{await sleep(D*.4);if(test(n.cond))await ex(n.body)}}
function chk(){var L=LV[cur],g=Object.keys(S.got).length;
if(L.need==='free'){if(cnt(script)<6)return'Use at least 6 blocks!';if(!has(script,['rep','forever']))return'Add a loop: repeat or forever.';if(!S.say)return'Add a say block 💬.';if(!S.snd)return'Add a sound block 🔊.';return''}
if(!atGoal())return'The cat is not at the goal yet. Count the squares and try again!';
if(L.need==='both'&&!(S.atSay&&S.atSnd))return'You made it! Now say 💬 and play 🔊 after the cat arrives.';
if(L.need==='score'&&S.n!==L.fish.length)return'Score is '+S.n+' but there are '+L.fish.length+' fish. Change the score each time the cat eats!';
if(g<L.fish.length)return'There are still fish left 🐟 ('+g+'/'+L.fish.length+'). Collect them all!';return''}
async function run(){if(running){running=false;return}
if(!script.length){msg('Add some blocks first!','bad');return}
drawStage();running=true;$('#run').textContent='⏹ Stop';$('#run').className='stop';renderPal();msg('Go, cat, go!');
try{await ex(script);var e=chk();if(e)msg(e,'bad');else win()}
catch(x){if(x.halt){var e2=chk();if(e2)msg(e2,'bad');else win()}else if(x.fail)msg(x.fail,'bad');else if(x.stop)msg('Stopped.');else throw x}
running=false;hl(null);$('#run').textContent='🏁 Go!';$('#run').className='';renderPal();$('#cat').classList.remove('shake')}
function win(){var L=LV[cur],ok=!L.par||cnt(script)<=L.par,st=ok?3:2;done[cur]=1;nav();msg('You did it!','good');beep(880,.15);setTimeout(function(){beep(1175,.25)},180);
var c=$('#card');
if(cur===LV.length-1){c.innerHTML='<div class="big">🎉🏆🎉</div><h2>You finished the island!</h2><div class="cert"><p>This certificate goes to</p><h2 id="nm">Scratch Star</h2><p>for helping Scratch Cat with 10 missions! 🐱</p></div><input id="name" placeholder="Type your name" maxlength="20" aria-label="Your name"><br><button id="pr">🖨 Print</button><button id="again">Play again</button>';
$('#name').oninput=function(){$('#nm').textContent=this.value||'Scratch Star'};$('#pr').onclick=function(){window.print()};$('#again').onclick=function(){done={};$('#ov').classList.remove('show');load(0)}}
else{c.innerHTML='<div class="big">🎉</div><h2>Mission complete!</h2><div class="big">'+'⭐'.repeat(st)+'☆'.repeat(3-st)+'</div><p>'+(ok?'Super neat code!':'Great job! Can you do it with '+L.par+' blocks or fewer?')+'</p><button id="nx">Next mission ▶</button><button id="rt">Stay here</button>';
$('#nx').onclick=function(){$('#ov').classList.remove('show');load(cur+1)};$('#rt').onclick=function(){$('#ov').classList.remove('show')}}
$('#ov').classList.add('show');setTimeout(function(){var f=c.querySelector('button');if(f)f.focus()},50)}
$('#run').onclick=run;
$('#reset').onclick=function(){if(!running){drawStage();msg('The cat is back at the start.')}};
$('#clear').onclick=function(){if(!running){script.length=0;tgt=script;drawStage();rs();msg('All clear! Drag a block to start.')}};
load(0);
</script>
</body>
</html>
